name = "test-mail"
main = "src/index.js"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[[send_email]]
name = "email"

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#Keep the D1 binding name unchanged
database_name = "test-email"		#D1 database name
database_id = "e65f099d-796d-4eaa-8dff-529b368b20db"		#D1 database ID

[[kv_namespaces]]
binding = "kv"			#Keep the KV binding name unchanged
id = "9be10cd058e04c55b526f8c0c116f50c"					#KV namespace ID

#(Optional)
#[[r2_buckets]]
#binding = "r2"			#Keep the R2 binding name unchanged
#bucket_name = "test-email"		#R2 bucket name

[ai]
binding = "ai"

[assets]
binding = "assets"		#Keep the static asset binding name unchanged
directory = "./dist"	#Built Vue assets directory; defaults to dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#Run hourly; resetDaySendCount takes effect only at midnight UTC


[vars]
ai_model = ""			#AI model; defaults to @cf/meta/llama-3.1-8b-instruct-fast
analysis_cache = false			#Enable analytics caching
orm_log = false			#Enable SQL logging
domain = ["example.com"]				#Email domains; multiple domains are supported, for example: ["example1.com","example2.com"]
admin = "admin@example.com"				#Administrator email, for example: admin@example.com
jwt_secret = "b7f29a1d-18e2-4d3b-941f-f6b2c97c02fd"			#JWT signing secret; use a long random value

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
